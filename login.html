<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Dashboard Pengawas CBT</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center font-sans text-slate-800">

  <div class="max-w-md w-full bg-white rounded-2xl shadow-sm border border-slate-200 p-8 m-4">
    <div class="text-center mb-8">
      <div class="text-4xl mb-2">🛡️</div>
      <h1 class="text-2xl font-bold text-slate-900">Login Pengawas</h1>
      <p class="text-sm text-slate-500 mt-1">Masukkan sandi untuk mengakses Dashboard CBT</p>
    </div>

    <form onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Password Pengawas</label>
        <input type="password" id="login-password" required placeholder="Masukkan password..." 
          class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
      </div>

      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition text-sm shadow-sm">
        Masuk ke Dashboard
      </button>
    </form>
  </div>

  <script>
    // Cek jika sudah login sebelumnya
    if (localStorage.getItem('cbt_is_logged_in') === 'true') {
      window.location.href = "index.html";
    }

    function handleLogin(event) {
      event.preventDefault();
      const pass = document.getElementById('login-password').value;
      
      // Ganti password di bawah ini sesuai keinginan Anda (Default: pengawas123)
      if (pass === "pengawas123") {
        localStorage.setItem('cbt_is_logged_in', 'true');
        Swal.fire({
          icon: 'success',
          title: 'Login Berhasil',
          showConfirmButton: false,
          timer: 1000
        }).then(() => {
          window.location.href = "index.html";
        });
      } else {
        Swal.fire({
          icon: 'error',
          title: 'Password Salah',
          text: 'Silakan periksa kembali password pengawas Anda.'
        });
      }
    }
  </script>
</body>
</html>
