<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Pengawas CBT</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen font-sans">
  <div class="bg-white p-8 rounded-xl shadow-sm border border-slate-200 max-w-md w-full">
    <h2 class="text-2xl font-bold text-slate-800 mb-2">Login Pengawas</h2>
    <p class="text-slate-500 text-sm mb-6">Silakan masuk untuk memantau ujian.</p>
    
    <form onsubmit="event.preventDefault(); window.location.href='index.html';">
      <div class="mb-4">
        <label class="block text-slate-700 text-sm font-semibold mb-2">Username</label>
        <input type="text" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <div class="mb-6">
        <label class="block text-slate-700 text-sm font-semibold mb-2">Password</label>
        <input type="password" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg transition duration-200">
        Masuk ke Dashboard
      </button>
    </form>
  </div>
</body>
</html>
