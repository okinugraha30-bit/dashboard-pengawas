<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Dashboard Pengawas CBT</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full border border-slate-200">
    <div class="text-center mb-6">
      <div class="text-4xl mb-2">🛡️</div>
      <h2 class="text-2xl font-bold text-slate-800">Login Pengawas CBT</h2>
      <p class="text-sm text-slate-500 mt-1">Masukkan kredensial untuk mengakses dashboard</p>
    </div>

    <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">Username</label>
        <input type="text" id="username" required placeholder="Masukkan username pengawas" 
               class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">Password</label>
        <input type="password" id="password" required placeholder="••••••••" 
               class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
      </div>

      <button type="submit" 
              class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow-md transition duration-200">
        Masuk Dashboard
      </button>
    </form>
  </div>

  <script>
    // Cek jika sudah login sebelumnya, langsung lempar ke index.html
    if (sessionStorage.getItem('cbt_admin_logged_in') === 'true') {
      window.location.href = "index.html";
    }

    function handleLogin(e) {
      e.preventDefault();
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value.trim();

      // Kredensial Pengawas (Sesuaikan jika ingin diubah)
      if (user === "admin" && pass === "cbtbro") {
        sessionStorage.setItem('cbt_admin_logged_in', 'true');
        Swal.fire({
          icon: 'success',
          title: 'Login Berhasil',
          text: 'Mengalihkan ke dashboard...',
          timer: 1200,
          showConfirmButton: false
        }).then(() => {
          window.location.href = "index.html";
        });
      } else {
        Swal.fire({
          icon: 'error',
          title: 'Login Gagal',
          text: 'Username atau password yang Anda masukkan salah!'
        });
      }
    }
  </script>
</body>
</html>
