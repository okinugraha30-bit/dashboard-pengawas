<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Proktor Utama - CBT</title>
    <!-- Library PubNub Real-time -->
    <script src="https://cdn.pubnub.com/sdk/javascript/pubnub.7.2.0.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #f8fafc; margin: 0; padding: 20px; color: #1e293b; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h2 { margin: 0; color: #0f172a; }
        .toolbar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
        button, label.btn-file { background: #3b82f6; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px; display: inline-block; }
        button:hover, label.btn-file:hover { background: #2563eb; }
        button.btn-pause { background: #f59e0b; }
        button.btn-resume { background: #10b981; }
        button.btn-logout { background: #ef4444; }
        button.btn-logout:hover { background: #dc2626; }
        input[type="file"], select, input[type="text"], input[type="password"] { padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #e2e8f0; padding: 12px; text-align: left; font-size: 14px; }
        th { background: #f1f5f9; color: #475569; }
        .status-online { color: #10b981; font-weight: bold; }
        .status-offline { color: #ef4444; font-weight: bold; }
        /* Overlay Login Proktor */
        #loginOverlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #0f172a; display: flex; align-items: center; justify-content: center; z-index: 99999; }
        .login-box { background: white; padding: 30px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3); }
        .login-box h3 { margin-top: 0; margin-bottom: 20px; color: #0f172a; text-align: center; }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; gap: 5px; }
    </style>
</head>
<body>

    <!-- FORM LOGIN PROKTOR UTAMA -->
    <div id="loginOverlay">
        <div class="login-box">
            <h3>Login Proktor Utama</h3>
            <div class="form-group">
                <label>Username:</label>
                <input type="text" id="loginUser" placeholder="Username proktor">
            </div>
            <div class="form-group">
                <label>Password:</label>
                <input type="password" id="loginPass" placeholder="Password">
            </div>
            <button onclick="handleLogin()" style="width: 100%; margin-top: 10px;">Masuk Dashboard</button>
        </div>
    </div>

    <!-- DASHBOARD UTAMA PROKTOR -->
    <div class="container" id="mainDashboard" style="display: none;">
        <div class="header-flex">
            <h2>Dashboard Proktor Utama</h2>
            <button class="btn-logout" onclick="handleLogout()">Logout</button>
        </div>
        
        <!-- Toolbar & Fitur Lama (Import, Ekspor, Filter Ruangan) + Kontrol Blackout -->
        <div class="toolbar">
            <label class="btn-file">
                Import Ruangan <input type="file" id="importFile" style="display: none;" onchange="importRuangan(this)">
            </label>
            <button onclick="exportRuangan()">Ekspor Ruangan</button>
            
            <select id="filterRuangan" onchange="filterDataRuangan()">
                <option value="ALL">Semua Ruangan</option>
                <option value="Ruang 1">Ruang 1</option>
                <option value="Ruang 2">Ruang 2</option>
            </select>

            <!-- Tombol Kontrol Jeda/Blackout Real-time -->
            <button class="btn-pause" onclick="sendGlobalPause()">⏸ Jeda Ujian (Blackout)</button>
            <button class="btn-resume" onclick="sendGlobalResume()">▶ Lanjutkan Ujian</button>
        </div>

        <!-- Tabel Monitoring Siswa -->
        <table>
            <thead>
                <tr>
                    <th>No</th>
                    <th>Nama Siswa</th>
                    <th>Ruangan</th>
                    <th>Status Login</th>
                    <th>Status Pelanggaran</th>
                    <th>Aksi Kontrol</th>
                </tr>
            </thead>
            <tbody id="studentTableBody">
                <!-- Baris data siswa Anda yang sudah berjalan baik -->
                <tr>
                    <td>1</td>
                    <td>Contoh Siswa</td>
                    <td>Ruang 1</td>
                    <td><span class="status-online">Online</span></td>
                    <td>Aman</td>
                    <td>
                        <button onclick="sendUnlockCommand('Contoh Siswa')" style="padding: 5px 10px; font-size: 12px;">Buka Kunci</button>
                        <button onclick="sendForceSubmitCommand('Contoh Siswa')" style="padding: 5px 10px; font-size: 12px; background: #ef4444;">Force Submit</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

<script>
    let pubnubClient = null;

    // Cek Login Saat Halaman Dimuat
    window.addEventListener('load', () => {
        if (localStorage.getItem('proktor_logged_in') === 'true') {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('mainDashboard').style.display = 'block';
            initPubNub();
        }
    });

    function handleLogin() {
        let user = document.getElementById('loginUser').value;
        let pass = document.getElementById('loginPass').value;
        
        if (user === "proktor" && pass === "proktor123") {
            localStorage.setItem('proktor_logged_in', 'true');
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('mainDashboard').style.display = 'block';
            initPubNub();
        } else {
            alert("Username atau Password salah!");
        }
    }

    function handleLogout() {
        localStorage.removeItem('proktor_logged_in');
        location.reload();
    }

    function initPubNub() {
        pubnubClient = new PubNub({
            publishKey: "pub-c-5618932f-1208-4f99-81ed-334268b10f87",
            subscribeKey: "sub-c-a8bf0e07-65d5-4794-8564-7567ee20e659",
            uuid: "proktor_utama_" + Math.random().toString(36).substring(2, 9)
        });
        pubnubClient.subscribe({ channels: ["cbt_monitoring_channel"] });
        
        pubnubClient.addListener({
            message: function(msg) {
                if (msg.message && msg.message.type === "VIOLATION") {
                    console.log("Log pelanggaran masuk:", msg.message.studentName);
                }
            }
        });
    }

    // Fungsi Kontrol Jeda / Lanjutkan / Unlock / Force Submit via PubNub
    function sendGlobalPause() {
        if (pubnubClient) pubnubClient.publish({ channel: "cbt_monitoring_channel", message: { type: "GLOBAL_PAUSE" } }, () => alert("Perintah Jeda (Blackout) Dikirim!"));
    }
    function sendGlobalResume() {
        if (pubnubClient) pubnubClient.publish({ channel: "cbt_monitoring_channel", message: { type: "GLOBAL_RESUME" } }, () => alert("Ujian Dilanjutkan!"));
    }
    function sendUnlockCommand(name) {
        if (pubnubClient) pubnubClient.publish({ channel: "cbt_monitoring_channel", message: { type: "REMOTE_UNLOCK_COMMAND", targetStudent: name } }, () => alert("Buka kunci terkirim ke " + name));
    }
    function sendForceSubmitCommand(name) {
        if (pubnubClient) pubnubClient.publish({ channel: "cbt_monitoring_channel", message: { type: "FORCE_SUBMIT_COMMAND", targetStudent: name } }, () => alert("Force Submit terkirim ke " + name));
    }

    // Fungsi-fungsi lama Anda (Import, Ekspor, Filter) tetap dipertahankan
    function importRuangan(input) { /* Fungsi lama Anda */ }
    function exportRuangan() { /* Fungsi lama Anda */ }
    function filterDataRuangan() { /* Fungsi lama Anda */ }
</script>
</body>
</html>
