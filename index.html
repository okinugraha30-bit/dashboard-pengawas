<!-- SDK PubNub -->
<script src="https://cdn.pubnub.com/sdk/javascript/pubnub.7.2.0.min.js"></script>

<script>
(function() {
    // 1. DIBENARKAN: Bypass darurat via URL parameter ?bypass=1
    if (window.location.search.includes('bypass=1')) {
        console.log("CBT Shield: Bypass Mode Active.");
        return;
    }

    // 2. DIBENARKAN: Abaikan SEMUA Halaman Admin & Pengaturan Moodle
    if (window.location.pathname.includes('/admin/')) {
        console.log("CBT Shield: Admin Page Detected. Disabled.");
        return;
    }

    // 3. DIBENARKAN: Pengecekan Role Admin, Guru, dan Manager
    const isAdminOrTeacher = document.body.classList.contains('userrole-admin') ||
                             document.body.classList.contains('userrole-editingteacher') ||
                             document.body.classList.contains('userrole-manager') ||
                             document.body.classList.contains('userrole-teacher') ||
                             document.querySelector('a[href*="admin/search.php"]') !== null ||
                             document.querySelector('.nav-link[href*="admin"]') !== null;

    if (isAdminOrTeacher) {
        console.log("CBT Shield: Admin/Teacher Role Detected. Disabled.");
        return;
    }

    // 4. DIBENARKAN: Hanya aktif saat siswa SEDANG MENGERJAKAN UJIAN (Attempt Quiz)
    const isAttemptingQuiz = window.location.pathname.includes('/mod/quiz/attempt.php') || 
                             window.location.pathname.includes('/mod/quiz/summary.php');

    if (!isAttemptingQuiz) {
        return; // Jangan jalankan di luar pengerjaan kuis
    }

    // ==========================================
    // CONFIGURATION & PUBNUB INITIALIZATION
    // ==========================================
    const SECRET_SALT = "CBT_SECRET_KEY_2026";
    let violationCount = 0;
    let isQuizPaused = false;

    let pubnub = null;
    if (typeof PubNub !== 'undefined') {
        pubnub = new PubNub({
            publishKey: "pub-c-5618932f-1208-4f99-81ed-334268b10f87",
            subscribeKey: "sub-c-a8bf0e07-65d5-4794-8564-7567ee20e659",
            uuid: "student_" + Math.random().toString(36).substring(2, 7)
        });
        pubnub.subscribe({ channels: ["cbt_monitoring_channel"] });
    }

    // Mencegah Pop-up Password Manager Chrome
    document.addEventListener("DOMContentLoaded", function() {
        const passwordInputs = document.querySelectorAll('input[type="password"]');
        passwordInputs.forEach(input => {
            input.setAttribute('autocomplete', 'new-password');
            input.setAttribute('data-lpignore', 'true');
        });
    });

    // Helper Fungsi
    function getStudentName() {
        let nameEl = document.querySelector('.usertext') || 
                     document.querySelector('.logininfo') || 
                     document.querySelector('.userpicture');
        
        if (nameEl) {
            return nameEl.textContent
                .replace(/You are logged in as/i, '')
                .replace(/\u00A0/g, ' ')
                .replace(/\s*-\s*$/, '')
                .trim();
        }
        return "Siswa CBT";
    }

    function generateTOTP() {
        const epochSec = Math.floor(Date.now() / 1000);
        const currentStep = Math.floor(epochSec / 180);

        let hash = 0;
        const str = SECRET_SALT + currentStep;
        for (let i = 0; i < str.length; i++) {
            hash = ((hash << 5) - hash) + str.charCodeAt(i);
            hash |= 0;
        }
        return (Math.abs(hash % 900000) + 100000).toString();
    }

    function reportViolationToDashboard(reasonText) {
        violationCount++;
        const sName = getStudentName();

        if (pubnub) {
            pubnub.publish({
                channel: "cbt_monitoring_channel",
                message: {
                    type: "VIOLATION",
                    studentName: sName,
                    reason: reasonText,
                    count: violationCount,
                    timestamp: new Date().toLocaleTimeString()
                }
            });
        }

        lockScreenOverlay(reasonText);
    }

    function forceSubmitQuiz() {
        console.log("Menjalankan Force Submit Ujian Tuntas...");

        const submitAllBtn = Array.from(document.querySelectorAll('button, input[type="button"], input[type="submit"]'))
            .find(el => {
                const txt = (el.textContent || el.value || '').toLowerCase();
                return txt.includes('finish all and submit') || 
                       txt.includes('kumpulkan semua dan selesai') ||
                       txt.includes('submit all and finish');
            });

        if (submitAllBtn) {
            submitAllBtn.click();
            setTimeout(() => {
                const confirmBtn = document.querySelector('.modal-dialog .btn-primary, .moodle-dialogue-base .btn-primary, button[data-action="save"]');
                if (confirmBtn) {
                    confirmBtn.click();
                } else {
                    const quizForm = document.getElementById('responseform') || document.querySelector('form[action*="processattempt.php"]');
                    if (quizForm) quizForm.submit();
                }
            }, 400);
        } else {
            const finishAttemptBtn = document.querySelector('form button[type="submit"], input[id*="mod_quiz-next-nav"]');
            const quizForm = document.getElementById('responseform') || document.querySelector('form[action*="processattempt.php"]');

            if (finishAttemptBtn && quizForm) {
                let finishInput = document.querySelector('input[name="finishattempt"]');
                if (!finishInput) {
                    finishInput = document.createElement('input');
                    finishInput.type = 'hidden';
                    finishInput.name = 'finishattempt';
                    finishInput.value = '1';
                    quizForm.appendChild(finishInput);
                }
                quizForm.submit();
            } else if (quizForm) {
                quizForm.submit();
            }
        }
    }

    function lockScreenOverlay(reasonText) {
        let overlay = document.getElementById('cbt-lock-overlay');
        
        if (!overlay) {
            overlay = document.createElement('div');
            overlay.id = 'cbt-lock-overlay';
            overlay.style.cssText = `
                position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
                background-color: rgba(15, 23, 42, 0.98); z-index: 9999999;
                display: flex; flex-direction: column; align-items: center; justify-content: center;
                color: white; font-family: sans-serif; text-align: center; padding: 20px;
            `;
            document.body.appendChild(overlay);
        }

        overlay.innerHTML = `
            <div style="max-width: 450px; background: #1e293b; padding: 30px; border-radius: 16px; border: 1px solid #334155; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);">
                <div style="background: #ef4444; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px auto;">
                    <svg width="32" height="32" fill="none" stroke="white" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                </div>
                <h2 style="font-size: 22px; font-weight: bold; margin-bottom: 8px; color: #f8fafc;">Ujian Terkunci!</h2>
                <p style="color: #94a3b8; font-size: 14px; margin-bottom: 20px;">Terdeteksi Pelanggaran: <br><strong style="color: #fca5a5;">${reasonText}</strong></p>
                
                <div style="margin-bottom: 20px;">
                    <input type="text" id="cbt-passcode-input" placeholder="Masukkan Token Pembuka" maxlength="6" style="width: 100%; padding: 12px; font-size: 18px; text-align: center; tracking-widest: 4px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #38bdf8; font-weight: bold; outline: none;">
                    <p id="cbt-error-msg" style="color: #ef4444; font-size: 12px; margin-top: 6px; display: none;">Token salah! Minta ke Pengawas.</p>
                </div>

                <button id="cbt-unlock-btn" style="width: 100%; background: #0284c7; color: white; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px;">Buka Kunci Ujian</button>
            </div>
        `;

        overlay.style.display = 'flex';

        document.getElementById('cbt-unlock-btn').onclick = function() {
            const inputVal = document.getElementById('cbt-passcode-input').value.trim();
            const correctToken = generateTOTP();

            if (inputVal === correctToken) {
                overlay.style.display = 'none';
            } else {
                document.getElementById('cbt-error-msg').style.display = 'block';
            }
        };
    }

    if (pubnub) {
        pubnub.addListener({
            message: function(msg) {
                const data = msg.message;
                const myName = getStudentName();
                if (!data) return;

                if (data.type === "REMOTE_UNLOCK_COMMAND" && data.targetStudent === myName) {
                    const overlay = document.getElementById('cbt-lock-overlay');
                    if (overlay) overlay.style.display = 'none';
                }

                if (data.type === "FORCE_SUBMIT_COMMAND" && data.targetStudent === myName) {
                    forceSubmitQuiz();
                }

                if (data.type === "GLOBAL_PAUSE_SIGNAL") {
                    isQuizPaused = data.isPaused;
                    if (isQuizPaused) {
                        lockScreenOverlay("Ujian Sedang Dijeda oleh Pengawas");
                    } else {
                        const overlay = document.getElementById('cbt-lock-overlay');
                        if (overlay) overlay.style.display = 'none';
                    }
                }
            }
        });
    }

    // Deteksi Pindah Tab / Minimalize
    document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            reportViolationToDashboard("Meninggalkan Tab / Berpindah Aplikasi");
        }
    });

    // Block Copy, Cut, Paste, Right Click khusus area pengerjaan ujian
    document.addEventListener('copy', (e) => e.preventDefault());
    document.addEventListener('cut', (e) => e.preventDefault());
    document.addEventListener('paste', (e) => e.preventDefault());
    document.addEventListener('contextmenu', (e) => e.preventDefault());

})();
</script>
